  start: '2026-03-13'
  end: '2026-03-15'
- name: Summer Sale
  start: '2026-05-01'
  end: '2026-05-03'
- name: Weekend Sale
  start: '2026-06-20'
  end: '2026-06-21'
- name: Freedom Sale
  start: '2026-08-14'
  end: '2026-08-16'
- name: Festive Sale
  start: '2026-09-29'
  end: '2026-10-05'
