[project]
name = "pagermind-backend"
version = "1.0.0"
description = "PagerMind on-call assistant: FastAPI API, LangGraph agent and Hindsight memory worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "groq>=0.11",
    "hindsight-client>=0.10",
    "langfuse>=4.0",
    "sentry-sdk[fastapi]>=2.18",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
pagermind-import = "app.importers.cli:app"
pagermind-bank = "app.memory.setup:app"
pagermind-eval = "evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# E501: `ruff format` owns line length; it intentionally leaves long string literals intact.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Typer declares CLI options as call defaults by design.
"evals/cli.py" = ["B008"]
"evals/workflow/cli.py" = ["B008"]
# The generator plants synthetic, clearly fake secrets and uses a seeded RNG for reproducible test data.
"evals/workflow/generate.py" = ["S105", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Supabase / Hindsight / Groq credentials",
]
